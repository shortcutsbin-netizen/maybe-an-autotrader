# Read-only research data pull (Phase 2). No credentials, no orders.
# Trigger: commit a request file to research/collect/requests/ on the claude branch.
# Output: committed to the `data` branch under runs/<request name>/.
name: collect-public-data

on:
  workflow_dispatch:
    inputs:
      request:
        description: "Path to request JSON"
        required: true
  push:
    branches: [claude]
    paths: ["research/collect/requests/*.json"]

permissions:
  contents: write

concurrency:
  group: collect-public-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select request files
        id: sel
        run: |
          if [ -n "${{ github.event.inputs.request }}" ]; then
            echo "${{ github.event.inputs.request }}" > /tmp/requests.txt
          else
            git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'research/collect/requests/*.json' > /tmp/requests.txt || true
          fi
          cat /tmp/requests.txt
      - name: Pull data
        run: |
          mkdir -p out
          while read -r f; do
            [ -z "$f" ] && continue
            name=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['name'])" "$f")
            echo "== $f -> $name"
            python research/collect/kalshi_pull.py --request "$f" --out "out/$name" 2>&1 | tee "out/$name.log" || echo "FAILED $name" >> out/failures.txt
            mkdir -p "out/$name" && mv "out/$name.log" "out/$name/run.log"
          done < /tmp/requests.txt
      - name: Publish to data branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git clone --depth 1 --branch data "$url" _data 2>/dev/null; then
            mkdir _data && cd _data && git init -q && git checkout -q --orphan data && git remote add origin "$url" && cd ..
          fi
          mkdir -p _data/runs
          cp -r out/. _data/runs/ 2>/dev/null || true
          cd _data
          printf '%s run %s sha %s\n' "$(date -u +%FT%TZ)" "$GITHUB_RUN_ID" "$GITHUB_SHA" >> RUNS.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data: run $GITHUB_RUN_ID" || echo "nothing to commit"
          git push origin data
